<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengingat Belanja Counter Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;
            color: #333;
            -webkit-user-select: none;
            user-select: none;
        }
        h2 {
            margin-bottom: 5px;
            color: #222;
        }
        p.subtitle {
            color: #666;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            gap: 6px;
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }
        li span.teks-barang {
            flex: 1;
            word-break: break-word;
        }
        .selesai {
            text-decoration: line-through;
            color: #aaa;
        }
        .checkbox-tandai {
            display: none;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        ul.tampil-semua .checkbox-tandai {
            display: inline-block;
        }
        .btn-action {
            border: none;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 3px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            text-align: center;
            white-space: nowrap;
        }
        .btn-shopee { background: #ee4d2d; color: white; }
        .btn-shopee:hover { background: #d73211; }
        .btn-google { background: #4285F4; color: white; }
        .btn-google:hover { background: #3367d6; }
        .btn-hapus-item { background: #dc3545; color: white; font-size: 15px; padding: 2px 6px; }
        .btn-hapus-item:hover { background: #c82333; }
        .footer-action {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-footer-group { display: flex; gap: 8px; }
        .btn-hapus-checked { background: #dc3545; font-size: 13px; padding: 8px 12px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-hapus-checked:hover { background: #c82333; }
        .btn-batal-checked { background: #f0ad4e; font-size: 13px; padding: 8px 12px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-batal-checked:hover { background: #ec971f; }
        .kosong { text-align: center; color: #888; padding: 20px; font-size: 14px; }
        .status-sync { font-size: 11px; color: #007bff; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📌 Pengingat Belanja Counter</h2>
    <p class="subtitle">Tekan & tahan salah satu nama barang untuk memunculkan/menyembunyikan kotak centang.</p>
    <div id="statusSync" class="status-sync">Menghubungkan ke Cloud...</div>

    <form id="formIngat" class="input-box">
        <input type="text" id="namaBarang" placeholder="Contoh: Charger Vivan Type-C..." required autocomplete="off">
        <button type="submit" id="btnTambah">Tambah</button>
    </form>

    <ul id="listBarang"></ul>
    <div id="pesanKosong" class="kosong">Memuat data online...</div>

    <div class="footer-action">
        <button type="button" class="btn-hapus-checked" onclick="hapusYangDitandai()">Hapus</button>
        <div class="btn-footer-group">
            <button type="button" class="btn-batal-checked" onclick="batalSemuaCentang()">Batal</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw6Pw8lOZl7GYikNKEV7of4AXHSE90e2XNzcQXeDZoyKlyrwtiMQtnoyhXamWlAn40o5A/exec";

        let daftar = [];
        const form = document.getElementById('formIngat');
        const inputBarang = document.getElementById('namaBarang');
        const listBarang = document.getElementById('listBarang');
        const pesanKosong = document.getElementById('pesanKosong');
        const statusSync = document.getElementById('statusSync');
        const btnTambah = document.getElementById('btnTambah');

        async function ambilDataCloud() {
            statusSync.textContent = "Mengambil data dari Cloud...";
            try {
                // Menggunakan layanan corsproxy publik agar tembus pembatasan browser
                let proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(API_URL);
                let response = await fetch(proxyUrl);
                let json = await response.json();
                if (json.contents) {
                    daftar = JSON.parse(json.contents);
                    if (!Array.isArray(daftar)) daftar = [];
                } else {
                    daftar = [];
                }
                render();
                statusSync.textContent = "Status: Online & Sinkron (Google Sheets)";
            } catch (error) {
                statusSync.textContent = "Status: Gagal memuat dari Cloud.";
                pesanKosong.textContent = "Gagal terhubung ke server online.";
            }
        }

        async function simpanDataCloud() {
            statusSync.textContent = "Menyimpan ke Cloud...";
            btnTambah.disabled = true;
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors", // Mencegah error CORS saat mengirim data POST
                    body: JSON.stringify(daftar)
                });
                statusSync.textContent = "Status: Online & Sinkron (Google Sheets)";
            } catch (error) {
                statusSync.textContent = "Status: Gagal menyimpan perubahan.";
            }
            btnTambah.disabled = false;
        }

        function render() {
            listBarang.innerHTML = '';
            if (daftar.length === 0) {
                pesanKosong.style.display = 'block';
            } else {
                pesanKosong.style.display = 'none';
            }

            daftar.forEach((item, index) => {
                let keyword = encodeURIComponent(item.teks);
                let linkShopee = `https://shopee.co.id/search?keyword=${keyword}`;
                let linkGoogle = `https://www.google.com/search?q=${keyword}`;
                let nomorUrut = index + 1;

                let li = document.createElement('li');
                li.innerHTML = `
                    <div class="item-info" id="itemInfo-${index}">
                        <input type="checkbox" class="checkbox-tandai" ${item.selesai ? 'checked' : ''} onclick="toggleSelesai(event, ${index})">
                        <span style="font-weight: bold; color: #555; min-width: 20px;">${nomorUrut}.</span>
                        <span class="teks-barang ${item.selesai ? 'selesai' : ''}">${item.teks}</span>
                    </div>
                    <a href="${linkShopee}" target="_blank" class="btn-action btn-shopee" title="Cari di Shopee">Shopee</a>
                    <a href="${linkGoogle}" target="_blank" class="btn-action btn-google" title="Cari di Google Web">Google</a>
                    <button class="btn-action btn-hapus-item" onclick="hapusItem(${index})" title="Hapus">&times;</button>
                `;
                
                let itemInfo = li.querySelector(`#itemInfo-${index}`);
                let timer;

                itemInfo.addEventListener('mousedown', () => {
                    timer = setTimeout(() => { listBarang.classList.toggle('tampil-semua'); }, 600);
                });
                itemInfo.addEventListener('touchstart', () => {
                    timer = setTimeout(() => { listBarang.classList.toggle('tampil-semua'); }, 600);
                });

                itemInfo.addEventListener('mouseup', () => clearTimeout(timer));
                itemInfo.addEventListener('mouseleave', () => clearTimeout(timer));
                itemInfo.addEventListener('touchend', () => clearTimeout(timer));

                listBarang.appendChild(li);
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            let teksBarang = inputBarang.value.trim();
            if (teksBarang) {
                daftar.push({ teks: teksBarang, selesai: false });
                inputBarang.value = '';
                render();
                simpanDataCloud();
            }
        });

        function toggleSelesai(event, index) {
            event.stopPropagation();
            daftar[index].selesai = !daftar[index].selesai;
            render();
            simpanDataCloud();
        }

        function hapusItem(index) {
            daftar.splice(index, 1);
            render();
            simpanDataCloud();
        }

        function hapusYangDitandai() {
            let adaYangDicentang = daftar.some(item => item.selesai);
            if (!adaYangDicentang) {
                alert('Tidak ada item yang ditandai untuk dihapus.');
                return;
            }
            if (confirm('Hapus item yang sudah ditandai?')) {
                daftar = daftar.filter(item => !item.selesai);
                render();
                simpanDataCloud();
            }
        }

        function batalSemuaCentang() {
            let diubah = false;
            daftar.forEach(item => {
                if (item.selesai) {
                    item.selesai = false;
                    diubah = true;
                }
            });
            if (!diubah) {
                alert('Tidak ada centang yang perlu dibatalkan.');
                return;
            }
            render();
            simpanDataCloud();
        }

        // Ambil data pertama kali saat halaman dibuka
        ambilDataCloud();

        // Auto-refresh data dari cloud setiap 5 detik agar sinkron secara real-time
        setInterval(ambilDataCloud, 5000);
    </script>

</body>
</html>
